name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/mobilelab

  headless-reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - run: go build -o bin/mobilelab ./cmd/mobilelab
      - name: Run headless CI example
        working-directory: examples/ci
        env:
          MOBILELAB_BIN: ../../bin/mobilelab
        run: ./run.sh
      - name: Upload report fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobilelab-report-fixtures
          path: examples/ci/artifacts/
          if-no-files-found: error
          retention-days: 7
