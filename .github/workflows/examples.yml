name: Example applications

on:
  push:
    paths:
      - 'examples/apps/**'
      - '.github/workflows/examples.yml'
  pull_request:
    paths:
      - 'examples/apps/**'
      - '.github/workflows/examples.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - run: go build -o bin/mobilelab ./cmd/mobilelab
      - name: Validate checked-in MobileLab configuration and scenarios
        run: |
          for project in examples/apps/flutter examples/apps/react-native; do
            (cd "$project" && ../../../bin/mobilelab migrate --check)
          done

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/apps/flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/apps/react-native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: examples/apps/react-native/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --runInBand --no-watchman
