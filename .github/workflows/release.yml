name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ''
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            extension: ''
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            extension: ''
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            extension: ''
          - runner: windows-latest
            goos: windows
            goarch: amd64
            extension: '.exe'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build release binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          grep -qx "VERSION ?= $version" Makefile
          grep -qx "var Version = \"$version\"" internal/cli/cli.go
          output="dist/mobilelab-${GOOS}-${GOARCH}${{ matrix.extension }}"
          go build -trimpath -ldflags "-s -w -X github.com/mobilelab-dev/mobilelab/internal/cli.Version=${version}" -o "$output" ./cmd/mobilelab
      - uses: actions/upload-artifact@v7
        with:
          name: mobilelab-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  sdk-build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            sdk/react-native/package-lock.json
            sdk/capacitor/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            sdk/android/mobilelab-android/*.gradle.kts
            sdk/android/mobilelab-android/gradle/wrapper/gradle-wrapper.properties
      - name: Build SDK packages
        shell: bash
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./sdk/react-native/package.json').version")" = "$version"
          test "$(node -p "require('./sdk/capacitor/package.json').version")" = "$version"
          grep -qx "version: $version" sdk/flutter/mobilelab_flutter/pubspec.yaml
          grep -qx "version = \"$version\"" sdk/android/mobilelab-android/build.gradle.kts
          grep -q "mobileLabKitVersion = \"$version\"" sdk/ios/MobileLabKit/Sources/MobileLabKit/MobileLabKit.swift
          npm ci --prefix sdk/react-native
          npm run build --prefix sdk/react-native
          npm pack ./sdk/react-native --pack-destination dist
          npm ci --prefix sdk/capacitor
          npm run build --prefix sdk/capacitor
          npm pack ./sdk/capacitor --pack-destination dist
          sdk/android/mobilelab-android/gradlew --no-daemon -p sdk/android/mobilelab-android test jar
          cp "sdk/android/mobilelab-android/build/libs/mobilelab-android-${version}.jar" dist/
          git archive --format=tar.gz --prefix=mobilelab_flutter/ --output="dist/mobilelab_flutter-${version}.tar.gz" HEAD:sdk/flutter/mobilelab_flutter
          git archive --format=tar.gz --prefix=MobileLabKit/ --output="dist/mobilelab-kit-${version}.tar.gz" HEAD:sdk/ios/MobileLabKit
      - uses: actions/upload-artifact@v7
        with:
          name: mobilelab-sdks
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, sdk-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mobilelab-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "MobileLab $GITHUB_REF_NAME"
