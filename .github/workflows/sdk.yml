name: SDKs

on:
  push:
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk.yml'
  pull_request:
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/flutter/mobilelab_flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/react-native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: sdk/react-native/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
