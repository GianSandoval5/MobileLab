schema_version: 1
project:
    name: app_prueba_mobilelab
server:
    host: 127.0.0.1
    port: 4566
dashboard:
    enabled: true
sandbox:
    latency: 350
    error_rate: 0
auth:
    enabled: true
device:
    auto_detect: true
variables:
    userId: "123"
push:
    payment-success:
        title: Pago completado
        body: Tu compra fue procesada correctamente
        data:
            purchaseId: purchase-new
endpoints:
    - path: /
      method: GET
      response:
        status: 200
        body:
            name: MobileLab Flutter Shop API
            version: 1.1.0
            dashboard: /dashboard
            example: /api/products
    - path: /api/auth/login
      method: POST
      response:
        status: 200
        fixture: auth-login.json
    - path: /api/auth/register
      method: POST
      response:
        status: 201
        fixture: auth-register.json
    - path: /api/businesses/biz-001/products
      method: GET
      response:
        status: 200
        fixture: business-products-tech.json
    - path: /api/businesses/biz-002/products
      method: GET
      response:
        status: 200
        fixture: business-products-home.json
    - path: /api/businesses/biz-003/products
      method: GET
      response:
        status: 200
        fixture: business-products-market.json
    - path: /api/payments
      method: POST
      response:
        status: 201
        fixture: payment.json
