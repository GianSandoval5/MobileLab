mobilelab:
  image: golang:1.23
  script:
    - go build -o bin/mobilelab ./cmd/mobilelab
    - cd examples/ci
    - MOBILELAB_BIN=../../bin/mobilelab ./run.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - examples/ci/artifacts/
    reports:
      junit: examples/ci/artifacts/mobilelab-junit.xml
